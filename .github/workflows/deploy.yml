name: Deploy SiliconTrack (Backend & Frontend)

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch: # Dodaje dugme "Run workflow" na GitHub-u

jobs:
  # 1. PRVO SE RADI BACKEND
  deploy-backend:
    name: 1. Deploy Symfony Backend (Cloud Run)
    runs-on: ubuntu-latest

    steps:
      # 1. Preuzmi tvoj kod
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Prijavi se na Google Cloud preko JSON ključa iz Secrets
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # 3. Podesi Google Cloud alate
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # 4. Autorizuj Docker za europe-west1 Artifact Registry
      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker europe-west1-docker.pkg.dev --quiet


      # 5. Spakuj Symfony i pošalji na Artifact Registry
      - name: Build and Push Docker Image
        run: |
          IMAGE_NAME="europe-west1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/silicontrack-backend/silicontrack-backend-david:${{ github.sha }}"
          docker build -t $IMAGE_NAME ./backend
          docker push $IMAGE_NAME

      - name: Run Database Migrations
        run: |
          IMAGE_NAME="europe-west1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/silicontrack-backend/silicontrack-backend-david:${{ github.sha }}"
          docker run --rm \
            -e APP_ENV=prod \
            -e APP_SECRET='${{ secrets.APP_SECRET }}' \
            -e DATABASE_URL='${{ secrets.DATABASE_URL }}' \
            "$IMAGE_NAME" php bin/console doctrine:migrations:migrate --no-interaction --allow-no-migration

      # 6. Pokreni Cloud Run servis
      - name: Deploy to Cloud Run
        run: |
          IMAGE_NAME="europe-west1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/silicontrack-backend/silicontrack-backend-david:${{ github.sha }}"
          gcloud run deploy silicontrack-backend-david \
            --image $IMAGE_NAME \
            --platform managed \
            --region europe-west1 \
            --allow-unauthenticated \
            --set-env-vars "APP_ENV=prod,APP_SECRET=${{ secrets.APP_SECRET }},DATABASE_URL=${{ secrets.DATABASE_URL }},JWT_PASSPHRASE=f76015fb15eb11d46c94c951567293d0e7606a05d5b835e1e9eea1f2dc0c358a,CORS_ALLOW_ORIGIN=^https?://.*$"

  # 2. TEK KADA BACKEND USPE, POKREĆE SE FRONTEND
  deploy-frontend:
    name: 2. Deploy React Frontend (Firebase)
    needs: deploy-backend # Zbog ovoga
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build React App
        working-directory: ./frontend
        run: npm run build

      - name: Deploy to Firebase Hosting
        uses: w9jds/firebase-action@master
        with:
          args: deploy --only hosting
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
